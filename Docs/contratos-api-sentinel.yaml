openapi: 3.0.3
info:
  title: SaaS Farmacéutico — Contratos de API
  version: 0.1.0
  description: |
    Contratos de todo el aplicativo, agrupados por feature (tag) y marcados con `x-mvp`.
    Primero van las features del MVP (HU Must: H1–H11); después las post-MVP (Should/Could: H12–H23).

    Autenticación (access token + refresh token)
    - `POST /auth/register` y `POST /auth/login` devuelven `access_token` (JWT de corta duración), `refresh_token` y el usuario.
    - El JWT lleva `EmpresaId` como claim; el backend filtra todo por esa empresa. Nunca viaja en el cuerpo ni en la URL.
    - Cada petición privada envía `Authorization: Bearer <access_token>`. Cada operación declara su `security` de forma explícita.
    - Si una petición privada responde 401 (token faltante, inválido o vencido), el cliente llama a `POST /auth/refresh` con su `refresh_token`. Si el refresh también responde 401, la sesión terminó y el front lleva al login.
    - `POST /auth/refresh` rota el refresh token: el anterior queda revocado y se entrega uno nuevo.
    - `POST /auth/logout` revoca el refresh token; con él ya no se puede renovar la sesión.
    - Duraciones (x-supuesto, por definir): access token 15 min; refresh token 7 días, guardado con hash en el servidor.
    - Endpoints públicos (sin token): register, login, refresh y aceptar invitación. El resto exige BearerAuth.
    - Los errores usan `ErrorResponse` (`error` con un código y `message` con el texto para el usuario).

    Reglas transversales
    - Estados de vencimiento: `vencido` (vence antes de hoy), `por_vencer` (vence hoy o en los próximos 90 días), `vigente` (vence en más de 90 días).
    - "Hoy" se toma de America/Tegucigalpa (UTC-6). Las fechas son `date` (YYYY-MM-DD), sin hora.
    - Todo se filtra por la EmpresaId del JWT. Un recurso de otra empresa responde 404.
    - Baja lógica: lo dado de baja no aparece en listas, alertas ni dashboard.
    - El correo de usuario es único en todo el sistema.
    - En el MVP todos los usuarios de la empresa tienen los mismos permisos.
    - Los campos o endpoints marcados `x-supuesto: true` no están definidos en las HU y deben confirmarse con el contrato E4.
servers:
  - url: http://localhost:5000/api/v1
    description: API local (monolito)

tags:
  # ===================== MVP =====================
  - { name: "[MVP] Registro de empresa", description: "H1 · Épica 1", x-mvp: true, x-epic: "1. Acceso multi-empresa", x-historias: [H1] }
  - { name: "[MVP] Sesión", description: "H2 · Épica 1", x-mvp: true, x-epic: "1. Acceso multi-empresa", x-historias: [H2] }
  - { name: "[MVP] Productos", description: "H3, H4, H5 · Épica 2", x-mvp: true, x-epic: "2. Catálogo de productos y registros", x-historias: [H3, H4, H5] }
  - { name: "[MVP] Establecimientos y licencias", description: "H6, H7 · Épica 3", x-mvp: true, x-epic: "3. Establecimientos y licencias", x-historias: [H6, H7] }
  - { name: "[MVP] Alertas", description: "H8 · Épica 4", x-mvp: true, x-epic: "4. Alertas", x-historias: [H8] }
  - { name: "[MVP] Expediente y checklist", description: "H9, H11 · Épica 5", x-mvp: true, x-epic: "5. Expediente", x-historias: [H9, H11] }
  - { name: "[MVP] Dashboard", description: "H10 · Épica 6", x-mvp: true, x-epic: "6. Reportes", x-historias: [H10] }
  # ===================== POST-MVP =====================
  - { name: "[Post-MVP] Mantenimiento de establecimientos", description: "H12 · Épica 3 · Should", x-mvp: false, x-epic: "3. Establecimientos y licencias", x-historias: [H12] }
  - { name: "[Post-MVP] Usuarios y roles", description: "H13 · Épica 1 · Should", x-mvp: false, x-epic: "1. Acceso multi-empresa", x-historias: [H13] }
  - { name: "[Post-MVP] Documentos de requisitos", description: "H14 · Épica 5 · Should", x-mvp: false, x-epic: "5. Expediente", x-historias: [H14] }
  - { name: "[Post-MVP] Requisitos pendientes", description: "H15 · Épica 5 · Should", x-mvp: false, x-epic: "5. Expediente", x-historias: [H15] }
  - { name: "[Post-MVP] Renovaciones", description: "H16 · Épica 5 · Should", x-mvp: false, x-epic: "5. Expediente", x-historias: [H16] }
  - { name: "[Post-MVP] Alertas por correo", description: "H17 · Épica 4 · Should", x-mvp: false, x-epic: "4. Alertas", x-historias: [H17] }
  - { name: "[Post-MVP] Expediente de establecimiento", description: "H18 · Épica 5 · Should", x-mvp: false, x-epic: "5. Expediente", x-historias: [H18] }
  - { name: "[Post-MVP] Expediente en PDF", description: "H19 · Épica 5 · Should", x-mvp: false, x-epic: "5. Expediente", x-historias: [H19] }
  - { name: "[Post-MVP] Reportes de planificación", description: "H20 · Épica 6 · Should", x-mvp: false, x-epic: "6. Reportes", x-historias: [H20] }
  - { name: "[Post-MVP] Importación CSV", description: "H21 · Épica 2 · Could", x-mvp: false, x-epic: "2. Catálogo de productos y registros", x-historias: [H21] }
  - { name: "[Post-MVP] Historial de cambios", description: "H22 · Épica 5 · Could", x-mvp: false, x-epic: "5. Expediente", x-historias: [H22] }
  - { name: "[Post-MVP] Exportación de reportes", description: "H23 · Épica 6 · Could", x-mvp: false, x-epic: "6. Reportes", x-historias: [H23] }

paths:
  # ==========================================================================
  # MVP
  # ==========================================================================

  # ---------- [MVP] Registro de empresa (H1) ----------
  /auth/register:
    post:
      tags: ["[MVP] Registro de empresa"]
      operationId: registrarEmpresa
      summary: Registrar empresa y administrador en una sola operación
      description: "Crea empresa y administrador juntos; si falla una, no se crea ninguna. Devuelve la sesión iniciada (access y refresh token)."
      x-mvp: true
      x-historias: [H1]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistroEmpresaRequest" }
      responses:
        "201":
          description: Empresa y administrador creados; sesión iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: El correo ya está registrado en el sistema
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: EMAIL_ALREADY_EXISTS, message: "Ya existe una cuenta con este correo." }

  # ---------- [MVP] Sesión (H2) ----------
  /auth/login:
    post:
      tags: ["[MVP] Sesión"]
      operationId: iniciarSesion
      summary: Iniciar sesión
      description: "Ante datos incorrectos responde siempre el mismo mensaje, sin indicar cuál falló."
      x-mvp: true
      x-historias: [H2]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Autenticación exitosa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: INVALID_CREDENTIALS, message: "Correo o contraseña incorrectos" }

  /auth/refresh:
    post:
      tags: ["[MVP] Sesión"]
      operationId: renovarToken
      summary: Renovar el token de acceso
      description: "Rota el refresh token: el anterior queda revocado y se devuelve uno nuevo. Si responde 401, el front lleva al login."
      x-mvp: true
      x-historias: [H2]
      x-supuesto: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: Token renovado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: Refresh token expirado o revocado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: INVALID_REFRESH_TOKEN, message: "La sesión venció. Inicia sesión de nuevo." }

  /auth/logout:
    post:
      tags: ["[MVP] Sesión"]
      operationId: cerrarSesion
      summary: Cerrar sesión
      description: "Revoca el refresh token. El cliente también elimina sus tokens locales."
      x-mvp: true
      x-historias: [H2]
      x-supuesto: true
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200": { description: Sesión cerrada y refresh token revocado }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me:
    get:
      tags: ["[MVP] Sesión"]
      operationId: obtenerMiPerfil
      summary: Obtener el usuario autenticado
      x-mvp: true
      x-historias: [H2]
      x-supuesto: true
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Datos del usuario autenticado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------- [MVP] Productos (H3, H4, H5) ----------
  /productos:
    get:
      tags: ["[MVP] Productos"]
      operationId: listarProductos
      summary: Listar, buscar y filtrar productos con su estado
      description: Búsqueda y filtro resueltos en el backend. No incluye productos dados de baja.
      x-mvp: true
      x-historias: [H4]
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          description: Texto a buscar en nombre o número de registro
          schema: { type: string }
        - $ref: "#/components/parameters/EstadoFiltro"
      responses:
        "200":
          description: Lista de productos (vacía si no hay resultados)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Producto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: ["[MVP] Productos"]
      operationId: crearProducto
      summary: Registrar un producto con su registro sanitario
      description: Al guardar, el sistema genera automáticamente el checklist del expediente (H11) a partir de la plantilla fija.
      x-mvp: true
      x-historias: [H3, H11]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductoRequest" }
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Producto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: El número de registro ya existe en la empresa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /productos/{productoId}:
    parameters:
      - $ref: "#/components/parameters/ProductoId"
    get:
      tags: ["[MVP] Productos"]
      operationId: obtenerProducto
      summary: Obtener un producto
      x-mvp: true
      x-historias: [H3, H5]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Producto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Producto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: ["[MVP] Productos"]
      operationId: editarProducto
      summary: Editar un producto
      description: Rigen las mismas reglas que al registrar (H3).
      x-mvp: true
      x-historias: [H5]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductoRequest" }
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Producto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: El número de registro ya existe en la empresa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: ["[MVP] Productos"]
      operationId: darDeBajaProducto
      summary: Dar de baja un producto (baja lógica)
      description: No borra los datos. El producto desaparece de la lista, las alertas y el dashboard. La confirmación se pide en la pantalla.
      x-mvp: true
      x-historias: [H5]
      security:
        - BearerAuth: []
      responses:
        "204": { description: Producto dado de baja }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- [MVP] Establecimientos y licencias (H6, H7) ----------
  /establecimientos:
    get:
      tags: ["[MVP] Establecimientos y licencias"]
      operationId: listarEstablecimientos
      summary: Listar establecimientos con su licencia
      x-mvp: true
      x-historias: [H6]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista de establecimientos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Establecimiento" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: ["[MVP] Establecimientos y licencias"]
      operationId: crearEstablecimiento
      summary: Registrar un establecimiento con su licencia sanitaria
      description: Se asume una licencia por establecimiento (decisión pendiente).
      x-mvp: true
      x-historias: [H6]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstablecimientoRequest" }
      responses:
        "201":
          description: Establecimiento creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Establecimiento" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /licencias:
    get:
      tags: ["[MVP] Establecimientos y licencias"]
      operationId: listarLicencias
      summary: Ver el estado de las licencias
      description: Usa la misma regla de estado que los productos (H4). Cada licencia indica a qué establecimiento pertenece.
      x-mvp: true
      x-historias: [H7]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstadoFiltro"
      responses:
        "200":
          description: Lista de licencias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LicenciaConEstablecimiento" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------- [MVP] Alertas (H8) ----------
  /alertas:
    get:
      tags: ["[MVP] Alertas"]
      operationId: obtenerAlertas
      summary: Ver alertas de vencimiento
      description: |
        Se calculan al consultar, sin proceso programado. Grupos que no se solapan: vencidos, hasta 30 días (incluye hoy),
        31 a 60 y 61 a 90. Cada grupo va ordenado por fecha de vencimiento, la más cercana primero. Excluye lo dado de baja.
      x-mvp: true
      x-historias: [H8]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Alertas agrupadas por plazo (grupos vacíos si no hay alertas)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alertas" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------- [MVP] Expediente y checklist (H9, H11) ----------
  /productos/{productoId}/expediente:
    parameters:
      - $ref: "#/components/parameters/ProductoId"
    get:
      tags: ["[MVP] Expediente y checklist"]
      operationId: obtenerExpedienteProducto
      summary: Ver el expediente de un producto
      description: Datos del producto, registro sanitario, vigencia, estado y checklist con su avance. La impresión limpia se resuelve en el front con estilos de impresión.
      x-mvp: true
      x-historias: [H9, H11]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Expediente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpedienteProducto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /productos/{productoId}/checklist:
    parameters:
      - $ref: "#/components/parameters/ProductoId"
    get:
      tags: ["[MVP] Expediente y checklist"]
      operationId: obtenerChecklistProducto
      summary: Ver el checklist de un producto
      x-mvp: true
      x-historias: [H11]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Checklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checklist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /requisitos/{requisitoId}:
    parameters:
      - $ref: "#/components/parameters/RequisitoId"
    patch:
      tags: ["[MVP] Expediente y checklist"]
      operationId: actualizarRequisito
      summary: Marcar un requisito como cumplido o ajustar responsable y fecha límite
      description: Al marcar como cumplido queda registrado quién lo hizo y cuándo. Mientras no haya invitaciones, el responsable es un nombre libre.
      x-mvp: true
      x-historias: [H11]
      x-supuesto: true
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequisitoUpdate" }
      responses:
        "200":
          description: Requisito actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Requisito" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ---------- [MVP] Dashboard (H10) ----------
  /dashboard/riesgo:
    get:
      tags: ["[MVP] Dashboard"]
      operationId: obtenerDashboardRiesgo
      summary: Ver los seis totales de riesgo
      description: Totales de productos y licencias en vigente, por vencer y vencido. Coinciden con las listas de H4 y H7 y no incluyen lo dado de baja.
      x-mvp: true
      x-historias: [H10]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Totales
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardRiesgo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ==========================================================================
  # POST-MVP
  # ==========================================================================

  # ---------- [Post-MVP] Mantenimiento de establecimientos (H12) ----------
  /establecimientos/{establecimientoId}:
    parameters:
      - $ref: "#/components/parameters/EstablecimientoId"
    get:
      tags: ["[Post-MVP] Mantenimiento de establecimientos"]
      operationId: obtenerEstablecimiento
      summary: Obtener un establecimiento con su licencia
      x-mvp: false
      x-historias: [H12]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Establecimiento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Establecimiento" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: ["[Post-MVP] Mantenimiento de establecimientos"]
      operationId: editarEstablecimiento
      summary: Editar un establecimiento y su licencia
      description: Permite actualizar la fecha de vencimiento de una licencia renovada; el estado se recalcula.
      x-mvp: false
      x-historias: [H12]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstablecimientoRequest" }
      responses:
        "200":
          description: Establecimiento actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Establecimiento" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: ["[Post-MVP] Mantenimiento de establecimientos"]
      operationId: darDeBajaEstablecimiento
      summary: Dar de baja un establecimiento y su licencia (baja lógica)
      x-mvp: false
      x-historias: [H12]
      security:
        - BearerAuth: []
      responses:
        "204": { description: Establecimiento dado de baja }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- [Post-MVP] Usuarios y roles (H13) ----------
  /usuarios:
    get:
      tags: ["[Post-MVP] Usuarios y roles"]
      operationId: listarUsuarios
      summary: Listar los usuarios de la empresa
      x-mvp: false
      x-historias: [H13]
      x-supuesto: true
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Usuarios de la empresa
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Usuario" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /usuarios/invitaciones:
    post:
      tags: ["[Post-MVP] Usuarios y roles"]
      operationId: invitarUsuario
      summary: Invitar a una persona con su correo y rol
      description: Envía un correo con un enlace con vencimiento para crear la contraseña.
      x-mvp: false
      x-historias: [H13]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitacionRequest" }
      responses:
        "201": { description: Invitación enviada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: El correo ya existe en el sistema
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /usuarios/invitaciones/{token}/aceptar:
    post:
      tags: ["[Post-MVP] Usuarios y roles"]
      operationId: aceptarInvitacion
      summary: Crear la contraseña desde el enlace de invitación
      description: "Endpoint público. El token de invitación vence. Devuelve la sesión iniciada."
      x-mvp: false
      x-historias: [H13]
      x-supuesto: true
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AceptarInvitacionRequest" }
      responses:
        "200":
          description: Usuario activado; sesión iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "410":
          description: El enlace venció o ya se usó
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /usuarios/{usuarioId}:
    parameters:
      - name: usuarioId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: ["[Post-MVP] Usuarios y roles"]
      operationId: actualizarUsuario
      summary: Cambiar el rol o desactivar a un usuario
      description: "Un usuario desactivado deja de poder iniciar sesión y sus refresh tokens se revocan; sus registros se conservan."
      x-mvp: false
      x-historias: [H13]
      x-supuesto: true
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioUpdate" }
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- [Post-MVP] Documentos de requisitos (H14) ----------
  /requisitos/{requisitoId}/documentos:
    parameters:
      - $ref: "#/components/parameters/RequisitoId"
    get:
      tags: ["[Post-MVP] Documentos de requisitos"]
      operationId: listarDocumentosRequisito
      summary: Listar los documentos (con sus versiones) de un requisito
      x-mvp: false
      x-historias: [H14]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Documentos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Documento" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: ["[Post-MVP] Documentos de requisitos"]
      operationId: subirDocumentoRequisito
      summary: Subir un archivo (PDF o imagen) a un requisito
      description: Una versión nueva conserva la anterior. El tamaño máximo está por definir.
      x-mvp: false
      x-historias: [H14]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        "201":
          description: Documento subido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Documento" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: El archivo supera el tamaño máximo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "415":
          description: Tipo de archivo no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /documentos/{documentoId}/descarga:
    get:
      tags: ["[Post-MVP] Documentos de requisitos"]
      operationId: descargarDocumento
      summary: Descargar un documento
      description: Verifica que el documento pertenezca a la empresa del usuario.
      x-mvp: false
      x-historias: [H14]
      security:
        - BearerAuth: []
      parameters:
        - name: documentoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Archivo
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- [Post-MVP] Requisitos pendientes (H15) ----------
  /licencias/{licenciaId}/checklist:
    get:
      tags: ["[Post-MVP] Requisitos pendientes"]
      operationId: obtenerChecklistLicencia
      summary: Ver el checklist de requisitos de una licencia
      x-mvp: false
      x-historias: [H15]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LicenciaId"
      responses:
        "200":
          description: Checklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checklist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /requisitos/pendientes:
    get:
      tags: ["[Post-MVP] Requisitos pendientes"]
      operationId: listarRequisitosPendientes
      summary: Ver todo lo que falta en la empresa
      description: Agrupado por producto o por establecimiento. No incluye lo dado de baja.
      x-mvp: false
      x-historias: [H15]
      security:
        - BearerAuth: []
      parameters:
        - name: agruparPor
          in: query
          schema:
            type: string
            enum: [producto, establecimiento]
            default: producto
      responses:
        "200":
          description: Pendientes agrupados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendientesGrupo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------- [Post-MVP] Renovaciones (H16) ----------
  /productos/{productoId}/renovaciones:
    post:
      tags: ["[Post-MVP] Renovaciones"]
      operationId: iniciarRenovacionProducto
      summary: Iniciar la renovación del registro de un producto
      description: Solo si el registro está por vencer o vencido. Crea el checklist de renovación.
      x-mvp: false
      x-historias: [H16]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      responses:
        "201":
          description: Renovación iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Renovacion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: El registro está vigente o ya tiene una renovación en curso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /licencias/{licenciaId}/renovaciones:
    post:
      tags: ["[Post-MVP] Renovaciones"]
      operationId: iniciarRenovacionLicencia
      summary: Iniciar la renovación de una licencia
      x-mvp: false
      x-historias: [H16]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LicenciaId"
      responses:
        "201":
          description: Renovación iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Renovacion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: La licencia está vigente o ya tiene una renovación en curso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /renovaciones/{renovacionId}/completar:
    post:
      tags: ["[Post-MVP] Renovaciones"]
      operationId: completarRenovacion
      summary: Terminar la renovación y registrar la nueva fecha de vencimiento
      description: El estado se recalcula y se conserva la vigencia anterior.
      x-mvp: false
      x-historias: [H16]
      security:
        - BearerAuth: []
      parameters:
        - name: renovacionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompletarRenovacionRequest" }
      responses:
        "200":
          description: Renovación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Renovacion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ---------- [Post-MVP] Alertas por correo (H17) ----------
  /internal/alertas/enviar-correos:
    post:
      tags: ["[Post-MVP] Alertas por correo"]
      operationId: enviarAlertasPorCorreo
      summary: Disparar el envío diario de avisos (90, 60 y 30 días)
      description: |
        Lo llama un cron externo, porque Render gratis se duerme. Se protege con una llave de servicio, no con JWT de usuario.
        Registra los avisos enviados para no duplicarlos y excluye lo dado de baja.
      x-mvp: false
      x-historias: [H17]
      x-supuesto: true
      security:
        - CronKey: []
      responses:
        "200":
          description: Resumen del envío
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResumenEnvioCorreos" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------- [Post-MVP] Expediente de establecimiento (H18) ----------
  /establecimientos/{establecimientoId}/expediente:
    get:
      tags: ["[Post-MVP] Expediente de establecimiento"]
      operationId: obtenerExpedienteEstablecimiento
      summary: Ver el expediente de un establecimiento
      description: Datos del establecimiento, su licencia, fechas de vigencia y estado.
      x-mvp: false
      x-historias: [H18]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablecimientoId"
      responses:
        "200":
          description: Expediente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpedienteEstablecimiento" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- [Post-MVP] Expediente en PDF (H19) ----------
  /productos/{productoId}/expediente/pdf:
    get:
      tags: ["[Post-MVP] Expediente en PDF"]
      operationId: descargarExpedienteProductoPdf
      summary: Descargar el expediente de un producto como PDF generado en el servidor
      description: El PDF indica fecha y hora de generación y quién lo generó.
      x-mvp: false
      x-historias: [H19]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      responses:
        "200": { $ref: "#/components/responses/Pdf" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /establecimientos/{establecimientoId}/expediente/pdf:
    get:
      tags: ["[Post-MVP] Expediente en PDF"]
      operationId: descargarExpedienteEstablecimientoPdf
      summary: Descargar el expediente de un establecimiento como PDF generado en el servidor
      x-mvp: false
      x-historias: [H19]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablecimientoId"
      responses:
        "200": { $ref: "#/components/responses/Pdf" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- [Post-MVP] Reportes de planificación (H20) ----------
  /reportes/vencimientos-trimestre:
    get:
      tags: ["[Post-MVP] Reportes de planificación"]
      operationId: obtenerVencimientosTrimestre
      summary: Ver lo que vence en un trimestre, agrupado por mes
      description: Por defecto el trimestre actual (hora de Honduras). No incluye lo dado de baja.
      x-mvp: false
      x-historias: [H20]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Anio"
        - $ref: "#/components/parameters/Trimestre"
      responses:
        "200":
          description: Vencimientos por mes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VencimientosTrimestre" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /reportes/tramites-atrasados:
    get:
      tags: ["[Post-MVP] Reportes de planificación"]
      operationId: obtenerTramitesAtrasados
      summary: Ver los requisitos con fecha límite pasada y sin cumplir
      x-mvp: false
      x-historias: [H20]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Requisitos atrasados con su responsable
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RequisitoAtrasado" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------- [Post-MVP] Importación CSV (H21) ----------
  /productos/importacion/plantilla:
    get:
      tags: ["[Post-MVP] Importación CSV"]
      operationId: descargarPlantillaImportacion
      summary: Descargar la plantilla de CSV con las columnas esperadas
      x-mvp: false
      x-historias: [H21]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Plantilla CSV
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /productos/importacion:
    post:
      tags: ["[Post-MVP] Importación CSV"]
      operationId: importarProductos
      summary: Previsualizar o confirmar la importación de productos desde CSV
      description: |
        `modo=previsualizar` valida sin guardar y devuelve filas válidas y con error (con su motivo).
        `modo=confirmar` importa solo las filas válidas. Un número de registro repetido es error (regla de H3).
        Los productos importados reciben su checklist como en H11. Hay un límite de filas por archivo.
      x-mvp: false
      x-historias: [H21]
      x-supuesto: true
      security:
        - BearerAuth: []
      parameters:
        - name: modo
          in: query
          required: true
          schema:
            type: string
            enum: [previsualizar, confirmar]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        "200":
          description: Resultado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultadoImportacion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ---------- [Post-MVP] Historial de cambios (H22) ----------
  /productos/{productoId}/historial:
    get:
      tags: ["[Post-MVP] Historial de cambios"]
      operationId: obtenerHistorialProducto
      summary: Ver quién cambió qué y cuándo en un producto
      description: Registra altas, ediciones y bajas. Solo lectura; no se puede editar ni borrar.
      x-mvp: false
      x-historias: [H22]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      responses:
        "200":
          description: Cambios, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CambioHistorial" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /establecimientos/{establecimientoId}/historial:
    get:
      tags: ["[Post-MVP] Historial de cambios"]
      operationId: obtenerHistorialEstablecimiento
      summary: Ver quién cambió qué y cuándo en un establecimiento
      x-mvp: false
      x-historias: [H22]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablecimientoId"
      responses:
        "200":
          description: Cambios, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CambioHistorial" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- [Post-MVP] Exportación de reportes (H23) ----------
  /dashboard/riesgo/exportar:
    get:
      tags: ["[Post-MVP] Exportación de reportes"]
      operationId: exportarDashboardRiesgo
      summary: Exportar el dashboard de riesgo
      x-mvp: false
      x-historias: [H23]
      x-supuesto: true
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FormatoExportacion"
      responses:
        "200": { $ref: "#/components/responses/Archivo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /alertas/exportar:
    get:
      tags: ["[Post-MVP] Exportación de reportes"]
      operationId: exportarAlertas
      summary: Exportar las alertas de vencimiento
      x-mvp: false
      x-historias: [H23]
      x-supuesto: true
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FormatoExportacion"
      responses:
        "200": { $ref: "#/components/responses/Archivo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /reportes/vencimientos-trimestre/exportar:
    get:
      tags: ["[Post-MVP] Exportación de reportes"]
      operationId: exportarVencimientosTrimestre
      summary: Exportar los vencimientos del trimestre
      description: Trae las mismas filas y estados que se ven en pantalla, con los filtros aplicados.
      x-mvp: false
      x-historias: [H23]
      x-supuesto: true
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FormatoExportacion"
        - $ref: "#/components/parameters/Anio"
        - $ref: "#/components/parameters/Trimestre"
      responses:
        "200": { $ref: "#/components/responses/Archivo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token JWT con EmpresaId como claim. Vence pronto; se renueva con POST /auth/refresh."
    CronKey:
      type: apiKey
      in: header
      name: X-Cron-Key
      description: Llave de servicio para el proceso programado externo (post-MVP).

  parameters:
    ProductoId:
      name: productoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EstablecimientoId:
      name: establecimientoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LicenciaId:
      name: licenciaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequisitoId:
      name: requisitoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EstadoFiltro:
      name: estado
      in: query
      description: Filtrar por estado de vencimiento
      schema: { $ref: "#/components/schemas/EstadoVencimiento" }
    Anio:
      name: anio
      in: query
      description: Año del trimestre (por defecto, el actual)
      schema: { type: integer, example: 2026 }
    Trimestre:
      name: trimestre
      in: query
      description: Trimestre 1 a 4 (por defecto, el actual)
      schema: { type: integer, minimum: 1, maximum: 4 }
    FormatoExportacion:
      name: formato
      in: query
      description: "Formato del archivo (decisión pendiente: CSV o Excel)"
      schema:
        type: string
        enum: [csv, xlsx]
        default: csv

  responses:
    BadRequest:
      description: Solicitud incorrecta o datos inválidos. Los errores por campo van en `errors` para mostrarse junto a cada campo.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
    Unauthorized:
      description: Token de autenticación faltante, inválido o vencido. El cliente intenta POST /auth/refresh.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: El rol del usuario no permite esta acción.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Recurso no encontrado o perteneciente a otra empresa.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Pdf:
      description: Archivo PDF
      content:
        application/pdf:
          schema: { type: string, format: binary }
    Archivo:
      description: Archivo exportado
      content:
        text/csv:
          schema: { type: string }
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema: { type: string, format: binary }

  schemas:
    # ============================ Comunes ============================
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: { type: string, example: BAD_REQUEST }
        message: { type: string, example: "El campo 'numeroRegistro' es obligatorio." }
    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string, example: fechaVencimiento }
                  message: { type: string }
    EstadoVencimiento:
      type: string
      enum: [vigente, por_vencer, vencido]
      description: |
        vencido: vence antes de hoy. por_vencer: vence hoy o dentro de los próximos 90 días. vigente: vence en más de 90 días.
        Se calcula en el backend con la hora de Honduras.

    # ============================ MVP ============================
    # ---- Registro de empresa (H1) ----
    RegistroEmpresaRequest:
      type: object
      required: [nombreEmpresa, nombreAdministrador, correo, contrasena]
      properties:
        nombreEmpresa: { type: string }
        nombreAdministrador: { type: string }
        correo: { type: string, format: email, description: "Único en todo el sistema" }
        contrasena: { type: string, format: password, minLength: 8, description: "Mínimo por confirmar (se propone 8)" }

    # ---- Sesión (H2) ----
    LoginRequest:
      type: object
      required: [correo, contrasena]
      properties:
        correo: { type: string, format: email }
        contrasena: { type: string, format: password }
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    AuthResponse:
      type: object
      required: [access_token, refresh_token, token_type, user]
      properties:
        access_token: { type: string, description: "JWT de corta duración con EmpresaId como claim" }
        refresh_token: { type: string, description: "Sirve para renovar la sesión; se rota en cada refresh y se revoca al cerrar sesión" }
        token_type: { type: string, example: Bearer }
        user: { $ref: "#/components/schemas/Usuario" }
    Usuario:
      type: object
      required: [id, empresaId, nombre, correo, activo]
      properties:
        id: { type: string, format: uuid }
        empresaId: { type: string, format: uuid }
        nombre: { type: string }
        correo: { type: string, format: email }
        activo: { type: boolean }
        rol:
          $ref: "#/components/schemas/Rol"
          description: "Post-MVP (H13). En el MVP todos los usuarios de la empresa tienen los mismos permisos."

    # ---- Productos (H3, H4, H5) ----
    ProductoRequest:
      type: object
      required: [nombre, numeroRegistro, fechaEmision, fechaVencimiento]
      properties:
        nombre: { type: string }
        empresaId: { type: string, format: uuid }
        numeroRegistro: { type: string, description: "Único dentro de la empresa" }
        fechaEmision: { type: string, format: date }
        fechaVencimiento: { type: string, format: date, description: "Debe ser posterior a fechaEmision" }
    Producto:
      allOf:
        - $ref: "#/components/schemas/ProductoRequest"
        - type: object
          required: [id, estado]
          properties:
            id: { type: string, format: uuid }
            estado: { $ref: "#/components/schemas/EstadoVencimiento" }

    # ---- Establecimientos y licencias (H6, H7) ----
    TipoEstablecimiento:
      type: string
      enum: [bodega, planta, drogueria]
    LicenciaRequest:
      type: object
      required: [numero, fechaEmision, fechaVencimiento]
      properties:
        numero: { type: string }
        fechaEmision: { type: string, format: date }
        fechaVencimiento: { type: string, format: date, description: "Debe ser posterior a fechaEmision" }
    Licencia:
      allOf:
        - $ref: "#/components/schemas/LicenciaRequest"
        - type: object
          required: [id, estado]
          properties:
            id: { type: string, format: uuid }
            estado: { $ref: "#/components/schemas/EstadoVencimiento" }
    EstablecimientoRequest:
      type: object
      required: [nombre, tipo, ubicacion, licencia]
      properties:
        nombre: { type: string }
        tipo: { $ref: "#/components/schemas/TipoEstablecimiento" }
        ubicacion: { type: string }
        licencia: { $ref: "#/components/schemas/LicenciaRequest" }
    Establecimiento:
      type: object
      required: [id, nombre, tipo, ubicacion, licencia]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { $ref: "#/components/schemas/TipoEstablecimiento" }
        ubicacion: { type: string }
        licencia: { $ref: "#/components/schemas/Licencia" }
    LicenciaConEstablecimiento:
      allOf:
        - $ref: "#/components/schemas/Licencia"
        - type: object
          required: [establecimiento]
          properties:
            establecimiento:
              type: object
              required: [id, nombre]
              properties:
                id: { type: string, format: uuid }
                nombre: { type: string }

    # ---- Alertas (H8) ----
    TipoElemento:
      type: string
      enum: [producto, licencia]
    AlertaItem:
      type: object
      required: [tipo, id, nombre, fechaVencimiento, diasRestantes, estado]
      properties:
        tipo: { $ref: "#/components/schemas/TipoElemento" }
        id: { type: string, format: uuid, description: "Id del producto o de la licencia, para llevar a su detalle" }
        nombre: { type: string }
        fechaVencimiento: { type: string, format: date }
        diasRestantes: { type: integer, description: "Negativo si ya venció" }
        estado: { $ref: "#/components/schemas/EstadoVencimiento" }
        requisitosFaltantes:
          type: integer
          description: Post-MVP (H15). No se envía en el MVP.
          x-mvp: false
    Alertas:
      type: object
      required: [vencidos, hasta30, de31a60, de61a90]
      description: Cada elemento aparece en un solo grupo; cada grupo va ordenado por fecha de vencimiento ascendente.
      properties:
        vencidos: { type: array, items: { $ref: "#/components/schemas/AlertaItem" } }
        hasta30: { type: array, items: { $ref: "#/components/schemas/AlertaItem" }, description: "Incluye los que vencen hoy" }
        de31a60: { type: array, items: { $ref: "#/components/schemas/AlertaItem" } }
        de61a90: { type: array, items: { $ref: "#/components/schemas/AlertaItem" } }

    # ---- Expediente y checklist (H9, H11) ----
    EstadoRequisito:
      type: string
      enum: [pendiente, cumplido]
    Requisito:
      type: object
      required: [id, descripcion, estado]
      properties:
        id: { type: string, format: uuid }
        descripcion: { type: string, description: "Viene de la plantilla fija definida por el equipo" }
        estado: { $ref: "#/components/schemas/EstadoRequisito" }
        responsable: { type: string, nullable: true, description: "Nombre libre mientras no haya invitaciones de usuarios" }
        fechaLimite: { type: string, format: date, nullable: true }
        cumplidoPor: { type: string, nullable: true, description: "Quién lo marcó como cumplido" }
        cumplidoEn: { type: string, format: date-time, nullable: true }
    RequisitoUpdate:
      type: object
      properties:
        estado: { $ref: "#/components/schemas/EstadoRequisito" }
        responsable: { type: string, nullable: true }
        fechaLimite: { type: string, format: date, nullable: true }
    Checklist:
      type: object
      required: [requisitos, avance]
      properties:
        requisitos: { type: array, items: { $ref: "#/components/schemas/Requisito" } }
        avance:
          type: object
          required: [cumplidos, total]
          properties:
            cumplidos: { type: integer }
            total: { type: integer }
    ExpedienteProducto:
      type: object
      required: [producto]
      properties:
        producto: { $ref: "#/components/schemas/Producto" }
        checklist: { $ref: "#/components/schemas/Checklist" }

    # ---- Dashboard (H10) ----
    TotalesPorEstado:
      type: object
      required: [vigente, porVencer, vencido]
      properties:
        vigente: { type: integer }
        porVencer: { type: integer }
        vencido: { type: integer }
    DashboardRiesgo:
      type: object
      required: [productos, licencias]
      properties:
        productos: { $ref: "#/components/schemas/TotalesPorEstado" }
        licencias: { $ref: "#/components/schemas/TotalesPorEstado" }

    # ============================ POST-MVP ============================
    # ---- Usuarios y roles (H13) ----
    Rol:
      type: string
      enum: [administrador, encargado_regulatorio, gerencia]
      description: Por confirmar. gerencia es solo lectura.
    UsuarioUpdate:
      type: object
      properties:
        rol: { $ref: "#/components/schemas/Rol" }
        activo: { type: boolean }
    InvitacionRequest:
      type: object
      required: [correo, rol]
      properties:
        correo: { type: string, format: email }
        rol: { $ref: "#/components/schemas/Rol" }
    AceptarInvitacionRequest:
      type: object
      required: [nombre, contrasena]
      properties:
        nombre: { type: string }
        contrasena: { type: string, format: password, minLength: 8 }

    # ---- Documentos (H14) ----
    Documento:
      type: object
      required: [id, nombreArchivo, version, subidoPor, subidoEn]
      properties:
        id: { type: string, format: uuid }
        nombreArchivo: { type: string }
        version: { type: integer, minimum: 1 }
        subidoPor: { type: string }
        subidoEn: { type: string, format: date-time }

    # ---- Requisitos pendientes (H15) ----
    PendientesGrupo:
      type: object
      required: [tipo, id, nombre, pendientes]
      properties:
        tipo:
          type: string
          enum: [producto, establecimiento]
        id: { type: string, format: uuid }
        nombre: { type: string }
        pendientes: { type: array, items: { $ref: "#/components/schemas/Requisito" } }

    # ---- Renovaciones (H16) ----
    Renovacion:
      type: object
      required: [id, tipo, objetoId, estado, checklist]
      description: La decisión de si crea un registro nuevo o actualiza el existente sigue pendiente.
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: "#/components/schemas/TipoElemento" }
        objetoId: { type: string, format: uuid }
        estado:
          type: string
          enum: [en_curso, completada]
        checklist: { $ref: "#/components/schemas/Checklist" }
        vigenciaAnterior:
          type: object
          nullable: true
          properties:
            fechaEmision: { type: string, format: date }
            fechaVencimiento: { type: string, format: date }
        nuevaFechaVencimiento: { type: string, format: date, nullable: true }
    CompletarRenovacionRequest:
      type: object
      required: [nuevaFechaVencimiento]
      properties:
        nuevaFechaVencimiento: { type: string, format: date }

    # ---- Alertas por correo (H17) ----
    ResumenEnvioCorreos:
      type: object
      required: [enviados, omitidosPorDuplicado]
      properties:
        enviados: { type: integer }
        omitidosPorDuplicado: { type: integer }

    # ---- Expediente de establecimiento (H18) ----
    ExpedienteEstablecimiento:
      type: object
      required: [establecimiento]
      properties:
        establecimiento: { $ref: "#/components/schemas/Establecimiento" }

    # ---- Reportes de planificación (H20) ----
    VencimientosTrimestre:
      type: object
      required: [anio, trimestre, meses]
      properties:
        anio: { type: integer }
        trimestre: { type: integer, minimum: 1, maximum: 4 }
        meses:
          type: array
          items:
            type: object
            required: [mes, elementos]
            properties:
              mes: { type: integer, minimum: 1, maximum: 12 }
              elementos: { type: array, items: { $ref: "#/components/schemas/AlertaItem" } }
    RequisitoAtrasado:
      allOf:
        - $ref: "#/components/schemas/Requisito"
        - type: object
          required: [origen]
          properties:
            origen:
              type: object
              required: [tipo, id, nombre]
              properties:
                tipo: { $ref: "#/components/schemas/TipoElemento" }
                id: { type: string, format: uuid }
                nombre: { type: string }

    # ---- Importación CSV (H21) ----
    ResultadoImportacion:
      type: object
      required: [modo, filasValidas, filasConError]
      properties:
        modo:
          type: string
          enum: [previsualizar, confirmar]
        filasValidas: { type: integer }
        importadas: { type: integer, description: "Solo en modo confirmar" }
        filasConError:
          type: array
          items:
            type: object
            required: [fila, motivo]
            properties:
              fila: { type: integer }
              motivo: { type: string }

    # ---- Historial (H22) ----
    CambioHistorial:
      type: object
      required: [fecha, usuario, accion]
      properties:
        fecha: { type: string, format: date-time }
        usuario: { type: string }
        accion:
          type: string
          enum: [alta, edicion, baja]
        cambios:
          type: array
          items:
            type: object
            required: [campo]
            properties:
              campo: { type: string }
              valorAnterior: { type: string, nullable: true }
              valorNuevo: { type: string, nullable: true }