      summary: Expediente de un producto (H9)
      description: |
        Datos del producto, registro sanitario (o su estado `NoVerificado`/`EnTramite`),
        vigencia y estado. Si el registro tiene checklist, incluye avance y aviso de bloqueo.
        Un producto de otra empresa o dado de baja responde 404; un registro dado de baja
        no aparece. La hoja imprimible la arma el cliente (CSS de impresión).
      parameters:
        - $ref: '#/components/parameters/ProductoId'
      responses:
        '200':
          description: Expediente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expediente'
              examples:
                enTramite:
                  summary: Expediente de un producto con registro en trámite
                  value:
                    generadoEn: '2026-11-23T15:30:00Z'
                    empresa:
                      nombre: Distribuidora FarmaCentro S.A.
                    producto:
                      productoId: 00000000-0000-4000-8000-000000000201
                      nombre: Paracetamol 500 mg
                      categoria:
                        id: 00000000-0000-4000-8000-000000000101
                        nombre: Medicamento
                    registro:
                      registroId: 00000000-0000-4000-8000-000000000401
                      productoId: 00000000-0000-4000-8000-000000000201
                      tipoDocumento:
                        tipoDocumentoId: 00000000-0000-4000-8000-000000000301
                        codigo: REG-MED
                        nombre: Registro de medicamento
                        autoridadEmisora: ARSA
                        vigenciaMeses: 60
                      estado: EnTramite
                      numero: null
                      fechaEmision: null
                      fechaVencimiento: null
                      diasParaVencer: null
                      requiereVerificacion: false
                      tieneChecklist: true
                    checklist:
                      origen: Registro
                      origenId: 00000000-0000-4000-8000-000000000401
                      tipoDocumento:
                        tipoDocumentoId: 00000000-0000-4000-8000-000000000301
                        codigo: REG-MED
                        nombre: Registro de medicamento
                        autoridadEmisora: ARSA
                        vigenciaMeses: 60
                      avance:
                        cumplidos: 1
                        total: 6
                        porcentaje: 16.7
                      bloqueo:
                        bloqueado: true
                        faltantes:
                        - tipoDocumentoId: 00000000-0000-4000-8000-000000000302
                          codigo: LIC-DROG
                          nombre: Licencia de droguería
                          autoridadEmisora: ARSA
                          vigenciaMeses: 12
                      requisitos:
                      - checklistRequisitoId: 00000000-0000-4000-8000-000000000601
                        requisitoId: 00000000-0000-4000-8000-000000000701
                        descripcion: Solicitud
                        tipoRequisito: Documento
                        obligatorio: true
                        orden: 1
                        estado: Cumplido
                        responsable:
                          usuarioId: 00000000-0000-4000-8000-000000000001
                          nombre: María López
                        fechaLimite: null
                        fechaCumplimiento: '2026-11-23T15:30:00Z'
                      - checklistRequisitoId: 00000000-0000-4000-8000-000000000602
                        requisitoId: 00000000-0000-4000-8000-000000000702
                        descripcion: Declaración jurada
                        tipoRequisito: Documento
                        obligatorio: true
                        orden: 2
                        estado: Pendiente
                        responsable: null
                        fechaLimite: null
                        fechaCumplimiento: null
                      - checklistRequisitoId: 00000000-0000-4000-8000-000000000603
                        requisitoId: 00000000-0000-4000-8000-000000000703
                        descripcion: Ficha técnica
                        tipoRequisito: Documento
                        obligatorio: true
                        orden: 3
                        estado: Pendiente
                        responsable: null
                        fechaLimite: null
                        fechaCumplimiento: null
                      - checklistRequisitoId: 00000000-0000-4000-8000-000000000604
                        requisitoId: 00000000-0000-4000-8000-000000000704
                        descripcion: Certificado de buenas prácticas de manufactura
                        tipoRequisito: Documento
                        obligatorio: true
                        orden: 4
                        estado: Pendiente
                        responsable: null
                        fechaLimite: null
                        fechaCumplimiento: null
                      - checklistRequisitoId: 00000000-0000-4000-8000-000000000605
                        requisitoId: 00000000-0000-4000-8000-000000000705
                        descripcion: Etiqueta
                        tipoRequisito: Documento
                        obligatorio: true
                        orden: 5
                        estado: Pendiente
                        responsable: null
                        fechaLimite: null
                        fechaCumplimiento: null
                      - checklistRequisitoId: 00000000-0000-4000-8000-000000000606
                        requisitoId: 00000000-0000-4000-8000-000000000706
                        descripcion: Pago de tasa
                        tipoRequisito: Accion
                        obligatorio: true
                        orden: 6
                        estado: Pendiente
                        responsable: null
                        fechaLimite: null
                        fechaCumplimiento: null
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          description: El producto no existe, está dado de baja o es de otra empresa.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                noEncontrado:
                  summary: No encontrado
                  value:
                    status: 404
                    title: No encontrado
                    detail: Producto no encontrado.

  # ──────────────────────────── DASHBOARD ────────────────────────────
  /dashboard/resumen:
    get:
      tags: [Dashboard]
      operationId: obtenerResumenDashboard
      summary: Totales de productos y licencias por estado (H10)
      description: |
        Diez totales (productos y licencias × 5 estados). Coinciden con las listas
        de H4 y H7; solo cuenta datos de la empresa y excluye lo dado de baja.
      responses:
        '200':
          description: Resumen de riesgo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResumen'
              examples:
                resumen:
                  summary: Totales por estado
                  value:
                    fechaReferencia: '2026-11-23'
                    productos:
                      noVerificado: 1
                      enTramite: 2
                      vigente: 5
                      porVencer: 1
                      vencido: 1
                    licencias:
                      noVerificado: 0
                      enTramite: 1
                      vigente: 2
                      porVencer: 1
                      vencido: 0
        '401':
          $ref: '#/components/responses/NoAutenticado'

# ════════════════════════════ COMPONENTES ════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de corta duración. Incluye `usuarioId` y `empresaId`.

  parameters:
    ProductoId:
      name: productoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EstablecimientoId:
      name: establecimientoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChecklistRequisitoId:
      name: checklistRequisitoId
      in: path
      required: true
      description: Identificador del ítem del checklist (no del checklist completo).
      schema: { type: string, format: uuid }
    EstadoFiltro:
      name: estado
      in: query
      description: Filtra por estado de vencimiento.
      schema:
        $ref: '#/components/schemas/EstadoVencimiento'
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    TamanoPagina:
      name: tamanoPagina
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    NoAutenticado:
      description: Sin sesión activa o token inválido. El cliente redirige al login (o intenta `/auth/refresh`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            sinSesion:
              summary: Sin sesión o token vencido
              value:
                status: 401
                title: No autenticado
                detail: Sin sesión activa o el access token venció. Renueva con /auth/refresh o inicia sesión.

  schemas:
    # ───────── Comunes ─────────
    EstadoVencimiento:
      type: string
      enum: [NoVerificado, EnTramite, Vigente, PorVencer, Vencido]
      description: |
        - `NoVerificado`: aún no se indicó si se tiene el documento.
        - `EnTramite`: se indicó que no se tiene; sin fechas.
        - `Vencido`: ya venció.
        - `PorVencer`: vence hoy o en los próximos 90 días.
        - `Vigente`: vence en más de 90 días.

    CatalogoItem:
      type: object
      required: [id, nombre]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }

    EstadoCatalogoItem:
      type: object
      description: Estado de vencimiento para filtros y semáforo.
      required: [codigo, nombre]
      properties:
        codigo:
          $ref: '#/components/schemas/EstadoVencimiento'
        nombre:
          type: string
          description: Texto para mostrar (por ejemplo, "Por vencer").

    ProblemDetails:
      type: object
      description: Formato RFC 7807 con errores por campo.
      required: [status, title]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: object
          description: Mapa campo → mensajes.
          additionalProperties:
            type: array
            items: { type: string }

    # ───────── Autenticación ─────────
    RegistroEmpresaRequest:
      type: object
      required: [nombreEmpresa, nombre, correo, password]
      properties:
        nombreEmpresa: { type: string, maxLength: 200, example: Distribuidora FarmaCentro S.A. }
        nombre: { type: string, maxLength: 150, example: María López }
        correo: { type: string, format: email, maxLength: 254, example: maria@farmacentro.example }
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Entre 8 y 128 caracteres.

    LoginRequest:
      type: object
      required: [correo, password]
      properties:
        correo: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, maxLength: 128 }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    TokensResponse:
      type: object
      required: [accessToken, refreshToken, expiraEn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiraEn:
          type: string
          format: date-time
          description: Vencimiento del access token.

    UsuarioActual:
      type: object
      required: [usuarioId, nombre, correo, empresa]
      properties:
        usuarioId: { type: string, format: uuid }
        nombre: { type: string }
        correo: { type: string, format: email }
        empresa:
          type: object
          required: [empresaId, nombre]
          properties:
            empresaId: { type: string, format: uuid }
            nombre: { type: string }

    SesionResponse:
      type: object
      required: [tokens, usuario]
      properties:
        tokens:
          $ref: '#/components/schemas/TokensResponse'
        usuario:
          $ref: '#/components/schemas/UsuarioActual'

    # ───────── Documento (base de conocimiento) ─────────
    TipoDocumentoResumen:
      type: object
      description: Documento que el motor asignó a un registro o licencia.
      required: [tipoDocumentoId, codigo, nombre, vigenciaMeses]
      properties:
        tipoDocumentoId: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        autoridadEmisora: { type: string, example: ARSA }
        baseLegal: { type: string }
        vigenciaMeses: { type: integer }

    # ───────── Verificación / emisión ─────────
    EmisionRequest:
      type: object
      required: [numero, fechaEmision]
      description: Número y fecha de emisión siempre van juntos.
      properties:
        numero: { type: string, maxLength: 100 }
        fechaEmision: { type: string, format: date }

    VerificacionRequest:
      type: object
      required: [tieneDocumento]
      description: "Si `tieneDocumento` es `true`, `numero` y `fechaEmision` son obligatorios; si es `false`, no deben enviarse."
      properties:
        tieneDocumento:
          type: boolean
          description: "`true`: ya lo tengo (requiere numero y fechaEmision). `false`: pasa a En trámite y se crea el checklist."
        numero: { type: string, maxLength: 100 }
        fechaEmision: { type: string, format: date }

    # ───────── Registro sanitario ─────────
    RegistroSanitario:
      type: object
      required: [registroId, productoId, tipoDocumento, estado, numero, fechaEmision, fechaVencimiento, diasParaVencer, requiereVerificacion, tieneChecklist]
      properties:
        registroId: { type: string, format: uuid }
        productoId: { type: string, format: uuid }
        tipoDocumento:
          $ref: '#/components/schemas/TipoDocumentoResumen'
        estado:
          $ref: '#/components/schemas/EstadoVencimiento'
        numero: { type: string, nullable: true }
        fechaEmision: { type: string, format: date, nullable: true }
        fechaVencimiento: { type: string, format: date, nullable: true }
        diasParaVencer:
          type: integer
          nullable: true
          description: Negativo si ya venció. Nulo si no hay fechas.
        requiereVerificacion:
          type: boolean
          description: "`true` mientras el estado sea `NoVerificado` (la UI debe preguntar si ya lo tiene)."
        tieneChecklist: { type: boolean }

    # ───────── Producto ─────────
    CrearProductoRequest:
      type: object
      required: [nombre, categoriaProductoId]
      properties:
        nombre: { type: string, maxLength: 200, example: Paracetamol 500 mg }
        categoriaProductoId: { type: string, format: uuid }

    EditarProductoRequest:
      type: object
      minProperties: 1
      properties:
        nombre: { type: string, maxLength: 200 }
        categoriaProductoId:
          type: string
          format: uuid
          description: Inmutable. Solo se acepta si coincide con la actual.

    ProductoResumen:
      type: object
      required: [productoId, nombre, categoria]
      properties:
        productoId: { type: string, format: uuid }
        nombre: { type: string }
        categoria:
          $ref: '#/components/schemas/CatalogoItem'
        registro:
          allOf:
            - $ref: '#/components/schemas/RegistroSanitario'
          nullable: true
          description: Nulo si ninguna regla aplicó o el registro fue dado de baja.

    ProductoDetalle:
      allOf:
        - $ref: '#/components/schemas/ProductoResumen'

    ProductoCreadoResponse:
      type: object
      required: [producto]
      properties:
        producto:
          $ref: '#/components/schemas/ProductoResumen'
        mensaje:
          type: string
          nullable: true
          description: Presente si ninguna regla aplicó (se guardó sin registro ni checklist).

    ProductoPagina:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ProductoResumen'

    # ───────── Establecimiento y licencia ─────────
    CrearEstablecimientoRequest:
      type: object
      required: [nombre, tipoEstablecimientoId, ubicacion]
      properties:
        nombre: { type: string, maxLength: 200, example: Bodega Principal }
        tipoEstablecimientoId: { type: string, format: uuid }
        ubicacion: { type: string, maxLength: 300 }

    LicenciaSanitaria:
      type: object
      required: [licenciaId, establecimientoId, tipoDocumento, estado, numero, fechaEmision, fechaVencimiento, diasParaVencer, requiereVerificacion, tieneChecklist]
      properties:
        licenciaId: { type: string, format: uuid }
        establecimientoId: { type: string, format: uuid }
        tipoDocumento:
          $ref: '#/components/schemas/TipoDocumentoResumen'
        estado:
          $ref: '#/components/schemas/EstadoVencimiento'
        numero: { type: string, nullable: true }
        fechaEmision: { type: string, format: date, nullable: true }
        fechaVencimiento: { type: string, format: date, nullable: true }
        diasParaVencer: { type: integer, nullable: true }
        requiereVerificacion: { type: boolean }
        tieneChecklist: { type: boolean }

    EstablecimientoResumen:
      type: object
      required: [establecimientoId, nombre, tipo, ubicacion]
      properties:
        establecimientoId: { type: string, format: uuid }
        nombre: { type: string }
        tipo:
          $ref: '#/components/schemas/CatalogoItem'
        ubicacion: { type: string }
        licencia:
          allOf:
            - $ref: '#/components/schemas/LicenciaSanitaria'
          nullable: true
          description: Nula si ninguna regla aplicó o la licencia fue dada de baja.

    EstablecimientoDetalle:
      allOf:
        - $ref: '#/components/schemas/EstablecimientoResumen'

    EstablecimientoCreadoResponse:
      type: object
      required: [establecimiento]
      properties:
        establecimiento:
          $ref: '#/components/schemas/EstablecimientoResumen'
        mensaje:
          type: string
          nullable: true

    EstablecimientoPagina:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/EstablecimientoResumen'

    LicenciaListado:
      type: object
      required: [licenciaId, establecimiento, tipoDocumento, estado, numero, fechaEmision, fechaVencimiento, diasParaVencer, requiereVerificacion, tieneChecklist]
      properties:
        licenciaId: { type: string, format: uuid }
        establecimiento:
          type: object
          required: [establecimientoId, nombre]
          properties:
            establecimientoId: { type: string, format: uuid }
            nombre: { type: string }
        tipoDocumento:
          $ref: '#/components/schemas/TipoDocumentoResumen'
        estado:
          $ref: '#/components/schemas/EstadoVencimiento'
        numero: { type: string, nullable: true }
        fechaEmision: { type: string, format: date, nullable: true }
        fechaVencimiento: { type: string, format: date, nullable: true }
        diasParaVencer: { type: integer, nullable: true }
        requiereVerificacion: { type: boolean }
        tieneChecklist: { type: boolean }

    LicenciaPagina:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/LicenciaListado'

    PaginaBase:
      type: object
      required: [pagina, tamanoPagina, total]
      properties:
        pagina: { type: integer }
        tamanoPagina: { type: integer }
        total: { type: integer }

    # ───────── Checklist ─────────
    RequisitoChecklist:
      type: object
      required: [checklistRequisitoId, requisitoId, descripcion, tipoRequisito, obligatorio, orden, estado, responsable, fechaLimite, fechaCumplimiento]
      properties:
        checklistRequisitoId:
          type: string
          format: uuid
          description: Identifica este ítem del checklist (un requisito dentro de un registro o licencia).
        requisitoId: { type: string, format: uuid }
        descripcion:
          type: string
          description: Se lee del catálogo de requisitos, no se congela en el MVP.
        tipoRequisito:
          type: string
          enum: [Documento, Dato, Accion]
        obligatorio:
          type: boolean
          description: "Se lee de los requisitos del documento (catálogo)."
        orden:
          type: integer
          description: Copiado del catálogo al crear el checklist; no cambia después.
        estado:
          type: string
          enum: [Pendiente, Cumplido]
        responsable:
          type: object
          nullable: true
          required: [usuarioId, nombre]
          properties:
            usuarioId: { type: string, format: uuid }
            nombre: { type: string }
        fechaLimite: { type: string, format: date, nullable: true }
        fechaCumplimiento: { type: string, format: date-time, nullable: true }

    Avance:
      type: object
      required: [cumplidos, total, porcentaje]
      properties:
        cumplidos: { type: integer, example: 3 }
        total: { type: integer, example: 6 }
        porcentaje: { type: number, format: float, example: 50 }

    Bloqueo:
      type: object
      description: Calculado al consultar (no se guarda).
      required: [bloqueado, faltantes]
      properties:
        bloqueado: { type: boolean }
        faltantes:
          type: array
          description: Documentos requeridos que no existen emitidos y no vencidos.
          items:
            $ref: '#/components/schemas/TipoDocumentoResumen'

    Checklist:
      type: object
      required: [origen, origenId, tipoDocumento, avance, bloqueo, requisitos]
      properties:
        origen:
          type: string
          enum: [Registro, Licencia]
        origenId:
          type: string
          format: uuid
          description: "`registroId` o `licenciaId` según `origen`."
        tipoDocumento:
          $ref: '#/components/schemas/TipoDocumentoResumen'
        avance:
          $ref: '#/components/schemas/Avance'
        bloqueo:
          $ref: '#/components/schemas/Bloqueo'
        requisitos:
          type: array
          items:
            $ref: '#/components/schemas/RequisitoChecklist'

    ActualizarRequisitoRequest:
      type: object
      minProperties: 1
      properties:
        estado:
          type: string
          enum: [Pendiente, Cumplido]
        responsableUsuarioId:
          type: string
          format: uuid
          nullable: true
          description: Debe ser un usuario de la empresa.
        fechaLimite:
          type: string
          format: date
          nullable: true

    # ───────── Alertas ─────────
    Alerta:
      type: object
      required: [tipo, nombre, numero, fechaVencimiento, diasParaVencer, estado]
      properties:
        tipo:
          type: string
          enum: [Producto, Licencia]
          description: "`Producto` → viene `productoId`. `Licencia` → viene `establecimientoId`."
        productoId:
          type: string
          format: uuid
          nullable: true
          description: Presente solo si `tipo` es `Producto`. Para llevar al detalle.
        establecimientoId:
          type: string
          format: uuid
          nullable: true
          description: Presente solo si `tipo` es `Licencia`. Para llevar al detalle de su licencia.
        nombre:
          type: string
          description: Nombre del producto o del establecimiento.
        numero:
          type: string
          description: Número del registro o licencia (siempre emitido).
        fechaVencimiento: { type: string, format: date }
        diasParaVencer:
          type: integer
          description: Negativo si ya venció.
        estado:
          type: string
          enum: [PorVencer, Vencido]
          description: Solo estos dos estados generan alertas.

    AlertasResponse:
      type: object
      required: [fechaReferencia, total, vencidos, hasta30Dias, de31a60Dias, de61a90Dias]
      properties:
        fechaReferencia:
          type: string
          format: date
          description: "Hoy en Honduras."
        total: { type: integer }
        vencidos:
          type: array
          items: { $ref: '#/components/schemas/Alerta' }
        hasta30Dias:
          type: array
          items: { $ref: '#/components/schemas/Alerta' }
        de31a60Dias:
          type: array
          items: { $ref: '#/components/schemas/Alerta' }
        de61a90Dias:
          type: array
          items: { $ref: '#/components/schemas/Alerta' }

    # ───────── Expediente ─────────
    Expediente:
      type: object
      required: [empresa, producto, generadoEn]
      properties:
        generadoEn: { type: string, format: date-time }
        empresa:
          type: object
          properties:
            nombre: { type: string }
        producto:
          type: object
          required: [productoId, nombre, categoria]
          properties:
            productoId: { type: string, format: uuid }
            nombre: { type: string }
            categoria:
              $ref: '#/components/schemas/CatalogoItem'
        registro:
          allOf:
            - $ref: '#/components/schemas/RegistroSanitario'
          nullable: true
          description: Nulo si no hay registro o fue dado de baja.
        checklist:
          allOf:
            - $ref: '#/components/schemas/Checklist'
          nullable: true
          description: Presente solo si el registro tiene checklist (avance y bloqueo).

    # ───────── Dashboard ─────────
    TotalesPorEstado:
      type: object
      required: [noVerificado, enTramite, vigente, porVencer, vencido]
      properties:
        noVerificado: { type: integer }
        enTramite: { type: integer }
        vigente: { type: integer }
        porVencer: { type: integer }
