openapi: 3.0.3

info:
  title: Sentinel API (MVP)
  version: 0.1.0
  description: |
    API del sistema experto Sentinel para el control de registros sanitarios
    de productos y licencias sanitarias de establecimientos (ARSA, Honduras).

    ## Organización por funciones
    Cada grupo (tag) corresponde a una épica o función del MVP:

    | Tag | Historias | Función |
    |---|---|---|
    | Autenticación | H1, H2 | Registro de empresa, login, refresh, logout |
    | Catálogos | H3, H6, H4, H7 | Listas simples para formularios y filtros |
    | Productos | H3, H4, H5 | Alta, listado, edición y baja de productos |
    | Registros sanitarios | H3, H5, H11 | Verificación, emisión y baja del registro de un producto |
    | Establecimientos | H6 | Alta, consulta y baja de establecimientos |
    | Licencias sanitarias | H6, H7, H11 | Verificación, emisión, baja y listado de licencias |
    | Checklist | H11 | Requisitos pendientes, avance y bloqueos |
    | Alertas | H8 | Vencimientos en 30, 60 y 90 días y vencidos |
    | Expediente | H9 | Expediente imprimible de un producto |
    | Dashboard | H10 | Totales de riesgo por estado |

    ## Reglas transversales
    - **Multi-tenant:** `empresaId` sale siempre del token de acceso, nunca se envía
      en rutas ni cuerpos. Un recurso de otra empresa responde **404**, como si no existiera.
    - **Baja lógica:** lo dado de baja no se borra, pero no aparece en listas, alertas,
      dashboard ni expediente (responde 404 al consultarlo por id).
    - **Un solo usuario por empresa** en el MVP (el administrador).
    - **Fecha de referencia:** "hoy" es la fecha de Honduras (`America/Tegucigalpa`).
    - **Estados de vencimiento:** `NoVerificado`, `EnTramite`, `Vigente` (vence en más
      de 90 días), `PorVencer` (vence hoy o dentro de 90 días) y `Vencido`. El estado
      se calcula en el backend con la fecha de vencimiento (emisión + `vigenciaMeses`).
    - **Bloqueo de documentos:** no se guarda; se calcula al consultar el checklist.
    - **Fuera del MVP:** renovación y congelar la descripción/tipo del requisito en el checklist.
    - **Códigos de estado:** `400` datos inválidos (con `errors` por campo), `401` sin sesión
      o credenciales incorrectas, `404` no existe, está dado de baja o es de otra empresa,
      `409` conflicto (correo o número de registro duplicado, o el estado actual no permite
      la operación). No se usa `403`: hay un solo usuario por empresa.
    - Las fechas (`date`) usan formato `YYYY-MM-DD`; las marcas de tiempo, ISO 8601 UTC.

servers:
  - url: http://localhost:5000/api/v1
    description: Desarrollo local

tags:
  - name: Autenticación
    description: "Épica 1 (H1, H2). Registro de empresa, sesión y renovación de tokens."
  - name: Catálogos
    description: Catálogos simples globales de solo lectura.
  - name: Productos
    description: "Épica 2 (H3, H4, H5). Datos generales del producto."
  - name: Registros sanitarios
    description: "Épica 2 (H3, H5) y Épica 5 (H11). Registro sanitario único por producto."
  - name: Establecimientos
    description: "Épica 3 (H6). Locales físicos de la empresa."
  - name: Licencias sanitarias
    description: "Épica 3 (H6, H7) y Épica 5 (H11). Licencia única por establecimiento."
  - name: Checklist
    description: "Épica 5 (H11). Requisitos que se deben reunir cuando no se tiene el documento."
  - name: Alertas
    description: "Épica 4 (H8). Vencimientos agrupados por rango."
  - name: Expediente
    description: "Épica 5 (H9). Vista del expediente de un producto."
  - name: Dashboard
    description: "Épica 6 (H10). Totales de riesgo."

security:
  - bearerAuth: []

paths:
  # ──────────────────────────── AUTENTICACIÓN ────────────────────────────
  /auth/registro:
    post:
      tags: [Autenticación]
      operationId: registrarEmpresa
      summary: Registrar empresa y administrador (H1)
      description: |
        Crea la empresa y su usuario administrador en una sola transacción:
        si falla uno, no se crea ninguno. El usuario queda con la sesión iniciada.
        El correo es único en todo el sistema.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroEmpresaRequest'
      responses:
        '201':
          description: Empresa y administrador creados. Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionResponse'
              examples:
                sesion:
                  summary: Empresa creada, sesión iniciada
                  value:
                    tokens:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ejemplo
                      refreshToken: rt_9f8e7d6c5b4a3210ejemplo
                      expiraEn: '2026-11-23T15:45:00Z'
                    usuario:
                      usuarioId: 00000000-0000-4000-8000-000000000001
                      nombre: María López
                      correo: maria@farmacentro.example
                      empresa:
                        empresaId: 00000000-0000-4000-8000-000000000002
                        nombre: Distribuidora FarmaCentro S.A.
        '400':
          description: Datos inválidos. `errors` indica el mensaje junto al campo que corresponde.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalido:
                  summary: Campos inválidos
                  value:
                    status: 400
                    title: Datos inválidos
                    detail: Uno o más campos no son válidos.
                    errors:
                      correo:
                      - El correo no tiene un formato válido.
                      password:
                      - La contraseña debe tener mínimo 8 caracteres.
        '409':
          description: El correo ya está registrado (el error se indica junto al campo `correo`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                correoDuplicado:
                  summary: Correo ya registrado
                  value:
                    status: 409
                    title: Conflicto
                    detail: Ya existe una cuenta con ese correo.
                    errors:
                      correo:
                      - El correo ya está registrado.

  /auth/login:
    post:
      tags: [Autenticación]
      operationId: iniciarSesion
      summary: Iniciar sesión (H2)
      description: |
        Con datos incorrectos responde un único mensaje genérico, sin indicar
        si falló el correo o la contraseña.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionResponse'
              examples:
                sesion:
                  summary: Sesión iniciada
                  value:
                    tokens:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ejemplo
                      refreshToken: rt_9f8e7d6c5b4a3210ejemplo
                      expiraEn: '2026-11-23T15:45:00Z'
                    usuario:
                      usuarioId: 00000000-0000-4000-8000-000000000001
                      nombre: María López
                      correo: maria@farmacentro.example
                      empresa:
                        empresaId: 00000000-0000-4000-8000-000000000002
                        nombre: Distribuidora FarmaCentro S.A.
        '400':
          description: Datos inválidos. `errors` indica el mensaje junto al campo que corresponde.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalido:
                  summary: Campos inválidos
                  value:
                    status: 400
                    title: Datos inválidos
                    detail: Uno o más campos no son válidos.
                    errors:
                      correo:
                      - El correo es obligatorio.
                      password:
                      - La contraseña es obligatoria.
        '401':
          description: Credenciales incorrectas (mensaje único, sin indicar si falló el correo o la contraseña).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                credenciales:
                  summary: Credenciales incorrectas
                  value:
                    status: 401
                    title: Credenciales incorrectas
                    detail: Correo o contraseña incorrectos.

  /auth/refresh:
    post:
      tags: [Autenticación]
      operationId: renovarSesion
      summary: Renovar la sesión sin pedir datos (H2)
      description: |
        Intercambia un refresh token vigente por un nuevo par de tokens.
        El token usado queda revocado y reemplazado (rotación).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Nuevo par de tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensResponse'
              examples:
                tokens:
                  summary: Nuevo par de tokens
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ejemplo
                    refreshToken: rt_9f8e7d6c5b4a3210ejemplo
                    expiraEn: '2026-11-23T15:45:00Z'
        '400':
          description: Datos inválidos. `errors` indica el mensaje junto al campo que corresponde.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalido:
                  summary: Campos inválidos
                  value:
                    status: 400
                    title: Datos inválidos
                    detail: Uno o más campos no son válidos.
                    errors:
                      refreshToken:
                      - El refresh token es obligatorio.
        '401':
          description: Refresh token inválido, vencido o revocado. El cliente debe ir al login.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                sesionVencida:
                  summary: Sesión vencida
                  value:
                    status: 401
                    title: Sesión vencida
                    detail: El refresh token es inválido, venció o fue revocado. Inicia sesión de nuevo.

  /auth/logout:
    post:
      tags: [Autenticación]
      operationId: cerrarSesion
      security: []
      summary: Cerrar sesión (H2)
      description: |
        Revoca el refresh token; al cerrar sesión se pierde el acceso. Es idempotente:
        si el refresh token ya estaba revocado o no existe, también responde 204. No exige access
        token, para poder cerrar sesión aunque ya haya vencido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Sesión cerrada.
        '400':
          description: Datos inválidos. `errors` indica el mensaje junto al campo que corresponde.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalido:
                  summary: Campos inválidos
                  value:
                    status: 400
                    title: Datos inválidos
                    detail: Uno o más campos no son válidos.
                    errors:
                      refreshToken:
                      - El refresh token es obligatorio.

  /auth/me:
    get:
      tags: [Autenticación]
      operationId: obtenerUsuarioActual
      summary: Usuario y empresa de la sesión actual (H2)
      description: Útil para proteger pantallas privadas y mostrar el responsable por defecto del checklist.
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioActual'
              examples:
                usuario:
                  summary: Usuario de la sesión
                  value:
                    usuarioId: 00000000-0000-4000-8000-000000000001
                    nombre: María López
                    correo: maria@farmacentro.example
                    empresa:
                      empresaId: 00000000-0000-4000-8000-000000000002
                      nombre: Distribuidora FarmaCentro S.A.
        '401':
          $ref: '#/components/responses/NoAutenticado'

  # ──────────────────────────── CATÁLOGOS ────────────────────────────
  /catalogos/categorias-producto:
    get:
      tags: [Catálogos]
      operationId: listarCategoriasProducto
      summary: Categorías de producto (Medicamento, Cosmético)
      responses:
        '200':
          description: Lista de elementos del catálogo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogoItem'
              examples:
                categorias:
                  summary: Categorías de producto
                  value:
                  - id: 00000000-0000-4000-8000-000000000101
                    nombre: Medicamento
                  - id: 00000000-0000-4000-8000-000000000102
                    nombre: Cosmético
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /catalogos/tipos-establecimiento:
    get:
      tags: [Catálogos]
      operationId: listarTiposEstablecimiento
      summary: Tipos de establecimiento (Farmacia, Droguería, Bodega)
      responses:
        '200':
          description: Lista de elementos del catálogo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogoItem'
              examples:
                tipos:
                  summary: Tipos de establecimiento
                  value:
                  - id: 00000000-0000-4000-8000-000000000111
                    nombre: Farmacia
                  - id: 00000000-0000-4000-8000-000000000112
                    nombre: Droguería
                  - id: 00000000-0000-4000-8000-000000000113
                    nombre: Bodega
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /catalogos/estados-vencimiento:
    get:
      tags: [Catálogos]
      operationId: listarEstadosVencimiento
      summary: Estados de vencimiento (para filtros y semáforo)
      description: Cada elemento trae `codigo` (el valor que se envía en el filtro `estado`) y `nombre` (texto para mostrar).
      responses:
        '200':
          description: Lista de elementos del catálogo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EstadoCatalogoItem'
              examples:
                estados:
                  summary: Estados de vencimiento
                  value:
                  - codigo: NoVerificado
                    nombre: No verificado
                  - codigo: EnTramite
                    nombre: En trámite
                  - codigo: Vigente
                    nombre: Vigente
                  - codigo: PorVencer
                    nombre: Por vencer
                  - codigo: Vencido
                    nombre: Vencido
        '401':
          $ref: '#/components/responses/NoAutenticado'

  # ──────────────────────────── PRODUCTOS ────────────────────────────
  /productos:
    get:
      tags: [Productos]
      operationId: listarProductos
      summary: Listar, buscar y filtrar productos con el estado de su registro (H4)
      description: Excluye los productos dados de baja.
      parameters:
        - name: q
          in: query
          description: Busca por nombre del producto o número de registro.
          schema: { type: string, maxLength: 200 }
        - $ref: '#/components/parameters/EstadoFiltro'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
      responses:
        '200':
          description: Página de productos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPagina'
              examples:
                pagina:
                  summary: Productos con el estado de su registro
                  value:
                    pagina: 1
                    tamanoPagina: 20
                    total: 2
                    items:
                    - productoId: 00000000-0000-4000-8000-000000000201
                      nombre: Paracetamol 500 mg
                      categoria:
                        id: 00000000-0000-4000-8000-000000000101
                        nombre: Medicamento
                      registro:
                        registroId: 00000000-0000-4000-8000-000000000401
                        productoId: 00000000-0000-4000-8000-000000000201
                        tipoDocumento:
                          tipoDocumentoId: 00000000-0000-4000-8000-000000000301
                          codigo: REG-MED
                          nombre: Registro de medicamento
                          autoridadEmisora: ARSA
                          vigenciaMeses: 60
                        estado: Vigente
                        numero: RS-0001-EJ
                        fechaEmision: '2026-10-15'
                        fechaVencimiento: '2031-10-15'
                        diasParaVencer: 1787
                        requiereVerificacion: false
                        tieneChecklist: false
                    - productoId: 00000000-0000-4000-8000-000000000202
                      nombre: Ibuprofeno 400 mg
                      categoria:
                        id: 00000000-0000-4000-8000-000000000101
                        nombre: Medicamento
                      registro:
                        registroId: 00000000-0000-4000-8000-000000000402
                        productoId: 00000000-0000-4000-8000-000000000202
                        tipoDocumento:
                          tipoDocumentoId: 00000000-0000-4000-8000-000000000301
                          codigo: REG-MED
                          nombre: Registro de medicamento
                          autoridadEmisora: ARSA
                          vigenciaMeses: 60
                        estado: EnTramite
                        numero: null
                        fechaEmision: null
                        fechaVencimiento: null
                        diasParaVencer: null
                        requiereVerificacion: false
                        tieneChecklist: true
        '400':
          description: Parámetros de consulta inválidos. `errors` indica el mensaje junto al parámetro.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalido:
                  summary: Campos inválidos
                  value:
                    status: 400
                    title: Datos inválidos
                    detail: Uno o más campos no son válidos.
                    errors:
                      estado:
                      - 'El estado no es válido. Valores permitidos: NoVerificado, EnTramite, Vigente, PorVencer, Vencido.'
                      pagina:
                      - La página debe ser mayor o igual a 1.
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Productos]
      operationId: crearProducto
      summary: Registrar un producto (H3, H11)
      description: |
        Guarda el producto y, aparte, su registro sanitario con el documento que el
        motor elige según la categoría (si varias reglas aplican, gana la de menor
        `prioridad`). El registro queda en estado `NoVerificado`.

        Si **ninguna regla aplica**, el producto se guarda sin registro ni checklist
        y la respuesta trae `registro: null` y un `mensaje`.
        El fabricante es la empresa; no se envía. Si `categoriaProductoId` no existe, responde 400
        con el error en ese campo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearProductoRequest'
            examples:
              ejemplo:
                summary: Medicamento
                value:
                  nombre: Paracetamol 500 mg
                  categoriaProductoId: 00000000-0000-4000-8000-000000000101
      responses:
        '201':
          description: Producto creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoCreadoResponse'
              examples:
                conRegistro:
                  summary: 'Se aplicó una regla: registro creado en No verificado'
                  value:
                    producto:
                      productoId: 00000000-0000-4000-8000-000000000201
                      nombre: Paracetamol 500 mg
                      categoria:
                        id: 00000000-0000-4000-8000-000000000101
                        nombre: Medicamento
                      registro:
                        registroId: 00000000-0000-4000-8000-000000000401
                        productoId: 00000000-0000-4000-8000-000000000201
                        tipoDocumento:
                          tipoDocumentoId: 00000000-0000-4000-8000-000000000301
                          codigo: REG-MED
                          nombre: Registro de medicamento
                          autoridadEmisora: ARSA
                          vigenciaMeses: 60
                        estado: NoVerificado
                        numero: null
                        fechaEmision: null
                        fechaVencimiento: null
                        diasParaVencer: null
                        requiereVerificacion: true
                        tieneChecklist: false
                sinRegla:
                  summary: 'Ninguna regla aplicó: producto sin registro ni checklist'
                  value:
                    producto:
                      productoId: 00000000-0000-4000-8000-000000000203
                      nombre: Crema hidratante facial
                      categoria:
                        id: 00000000-0000-4000-8000-000000000102
                        nombre: Cosmético
                      registro: null
                    mensaje: No existe una regla que aplique a este producto. Se guardó sin registro sanitario ni checklist.
        '400':
          description: Datos inválidos. `errors` indica el mensaje junto al campo que corresponde.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalido:
                  summary: Campos inválidos
                  value:
                    status: 400
                    title: Datos inválidos
                    detail: Uno o más campos no son válidos.
                    errors:
                      nombre:
                      - El nombre del producto es obligatorio.
                      categoriaProductoId:
                      - La categoría seleccionada no existe.
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /productos/{productoId}:
    parameters:
      - $ref: '#/components/parameters/ProductoId'
    get:
      tags: [Productos]
      operationId: obtenerProducto
      summary: Detalle de un producto con su registro (H3, H4, H8)
      responses:
        '200':
          description: Producto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoDetalle'
              examples:
                producto:
                  summary: Producto con registro vigente
                  value:
                    productoId: 00000000-0000-4000-8000-000000000201
                    nombre: Paracetamol 500 mg
                    categoria:
                      id: 00000000-0000-4000-8000-000000000101
                      nombre: Medicamento
                    registro:
                      registroId: 00000000-0000-4000-8000-000000000401
                      productoId: 00000000-0000-4000-8000-000000000201
                      tipoDocumento:
                        tipoDocumentoId: 00000000-0000-4000-8000-000000000301
                        codigo: REG-MED
                        nombre: Registro de medicamento
                        autoridadEmisora: ARSA
                        vigenciaMeses: 60
                      estado: Vigente
                      numero: RS-0001-EJ
                      fechaEmision: '2026-10-15'
                      fechaVencimiento: '2031-10-15'
                      diasParaVencer: 1787
                      requiereVerificacion: false
                      tieneChecklist: false
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          description: El producto no existe, está dado de baja o es de otra empresa.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                noEncontrado:
                  summary: No encontrado
                  value:
                    status: 404
                    title: No encontrado
                    detail: Producto no encontrado.
    patch:
      tags: [Productos]
      operationId: editarProducto
      summary: Editar un producto (H5)
      description: |
        La categoría no se puede cambiar; si se envía y difiere, responde 400 con el error en
        `categoriaProductoId`. Debe enviarse al menos un campo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditarProductoRequest'
            examples:
              cambiarNombre:
                summary: Cambiar el nombre
                value:
                  nombre: Paracetamol 500 mg (caja x 100)
      responses:
        '200':
          description: Producto actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoDetalle'
              examples:
                producto:
                  summary: Producto actualizado
                  value:
                    productoId: 00000000-0000-4000-8000-000000000201
                    nombre: Paracetamol 500 mg
                    categoria:
                      id: 00000000-0000-4000-8000-000000000101
                      nombre: Medicamento
                    registro:
                      registroId: 00000000-0000-4000-8000-000000000401
                      productoId: 00000000-0000-4000-8000-000000000201
                      tipoDocumento:
                        tipoDocumentoId: 00000000-0000-4000-8000-000000000301
                        codigo: REG-MED
                        nombre: Registro de medicamento
                        autoridadEmisora: ARSA
                        vigenciaMeses: 60
                      estado: Vigente
                      numero: RS-0001-EJ
                      fechaEmision: '2026-10-15'
                      fechaVencimiento: '2031-10-15'
                      diasParaVencer: 1787
                      requiereVerificacion: false
                      tieneChecklist: false
        '400':
          description: Datos inválidos. `errors` indica el mensaje junto al campo que corresponde.
          content:
            application/problem+json:
