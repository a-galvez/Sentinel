  /establecimientos/{establecimientoId}/licencia/verificacion:
    parameters:
      - $ref: '#/components/parameters/EstablecimientoId'
    post:
      tags: [Licencias sanitarias]
      operationId: verificarLicencia
      summary: Indicar si el establecimiento ya tiene licencia (H6, H11)
      description: |
        Solo válido mientras la licencia esté `NoVerificado` (si no, 409). Si `tieneDocumento` es
        `true` y falta `numero` o `fechaEmision`, o es `false` y se envían, 400.

        Orden de validación: 404, luego 409 (estado) y por último 400 (cuerpo). Si llegan dos
        solicitudes a la vez, solo una crea el checklist (hay un único checklist por licencia)
        y la otra recibe 409.
        - `tieneDocumento: true` → requiere `numero` y `fechaEmision`; se calcula vencimiento
          y estado. **No** se crea checklist.
        - `tieneDocumento: false` → pasa a `EnTramite` y se crea el checklist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificacionRequest'
            examples:
              yaLaTiene:
                summary: Ya tiene la licencia
                value:
                  tieneDocumento: true
                  numero: LS-0001-EJ
                  fechaEmision: '2026-11-10'
              noLaTiene:
                summary: Aún no la tiene (pasa a En trámite)
                value:
                  tieneDocumento: false
      responses:
        '200':
          description: Licencia verificada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenciaSanitaria'
              examples:
                yaLaTiene:
                  summary: 'Ya tenía la licencia: estado calculado, sin checklist'
                  value:
                    licenciaId: 00000000-0000-4000-8000-000000000411
                    establecimientoId: 00000000-0000-4000-8000-000000000501
                    tipoDocumento:
                      tipoDocumentoId: 00000000-0000-4000-8000-000000000302
                      codigo: LIC-DROG
                      nombre: Licencia de droguería
                      autoridadEmisora: ARSA
                      vigenciaMeses: 12
                    estado: Vigente
                    numero: LS-0001-EJ
                    fechaEmision: '2026-11-10'
                    fechaVencimiento: '2027-11-10'
                    diasParaVencer: 352
                    requiereVerificacion: false
                    tieneChecklist: false
                enTramite:
                  summary: 'No la tenía: pasa a En trámite con checklist'
                  value:
                    licenciaId: 00000000-0000-4000-8000-000000000411
                    establecimientoId: 00000000-0000-4000-8000-000000000501
                    tipoDocumento:
                      tipoDocumentoId: 00000000-0000-4000-8000-000000000302
                      codigo: LIC-DROG
                      nombre: Licencia de droguería
                      autoridadEmisora: ARSA
                      vigenciaMeses: 12
                    estado: EnTramite
                    numero: null
                    fechaEmision: null
                    fechaVencimiento: null
                    diasParaVencer: null
                    requiereVerificacion: false
                    tieneChecklist: true
        '400':
          description: Datos inválidos. `errors` indica el mensaje junto al campo que corresponde.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalido:
                  summary: Campos inválidos
                  value:
                    status: 400
                    title: Datos inválidos
                    detail: Los datos de verificación no son válidos.
                    errors:
                      numero:
                      - El número de licencia es obligatorio cuando ya se tiene el documento.
                      fechaEmision:
                      - La fecha de emisión es obligatoria cuando ya se tiene el documento.
                noLaTieneConDatos:
                  summary: Sin documento pero con datos
                  value:
                    status: 400
                    title: Datos inválidos
                    detail: Los datos de verificación no son válidos.
                    errors:
                      tieneDocumento:
                      - No se deben enviar número ni fecha de emisión cuando aún no se tiene el documento.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          description: El establecimiento no existe, está dado de baja o es de otra empresa; o no tiene licencia sanitaria (ninguna regla aplicó) o fue dada de baja.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                noEncontrado:
                  summary: No encontrado
                  value:
                    status: 404
                    title: No encontrado
                    detail: El establecimiento no existe o no tiene licencia sanitaria.
        '409':
          description: La licencia ya no está `NoVerificado`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                yaVerificada:
                  summary: Licencia ya verificada
                  value:
                    status: 409
                    title: Conflicto
                    detail: La licencia ya fue verificada. Solo se puede verificar mientras está en estado No verificado.

