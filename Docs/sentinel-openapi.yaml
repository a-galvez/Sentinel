        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          description: El producto no existe, está dado de baja o es de otra empresa; o no tiene registro sanitario (ninguna regla aplicó) o fue dado de baja.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                noEncontrado:
                  summary: No encontrado
                  value:
                    status: 404
                    title: No encontrado
                    detail: El producto no existe o no tiene registro sanitario.
    patch:
      tags: [Registros sanitarios]
      operationId: registrarEmisionRegistro
      summary: Registrar o corregir número y emisión del registro (H5)
      description: |
        Se usa cuando ARSA entrega el registro (pasa de `NoVerificado`/`EnTramite`
        a un estado calculado) o para corregir los datos. Número y fecha de emisión
        van juntos. El vencimiento = emisión + `vigenciaMeses` del documento.
        El número es único dentro de la empresa, **incluyendo registros dados de baja**
        (un número dado de baja no se libera); si ya existe en otro registro, responde 409
        con el error en `numero`. Si el registro estaba `EnTramite`, su checklist se conserva
        como solo lectura y `tieneChecklist` sigue en `true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmisionRequest'
            examples:
              emision:
                summary: Número y emisión del registro
                value:
                  numero: RS-0001-EJ
                  fechaEmision: '2026-10-15'
      responses:
        '200':
          description: Registro actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroSanitario'
              examples:
                vigente:
                  summary: Registro con emisión registrada
                  value:
                    registroId: 00000000-0000-4000-8000-000000000401
                    productoId: 00000000-0000-4000-8000-000000000201
                    tipoDocumento:
                      tipoDocumentoId: 00000000-0000-4000-8000-000000000301
                      codigo: REG-MED
                      nombre: Registro de medicamento
                      autoridadEmisora: ARSA
                      vigenciaMeses: 60
                    estado: Vigente
                    numero: RS-0001-EJ
                    fechaEmision: '2026-10-15'
                    fechaVencimiento: '2031-10-15'
                    diasParaVencer: 1787
                    requiereVerificacion: false
                    tieneChecklist: false
        '400':
          description: Datos inválidos. `errors` indica el mensaje junto al campo que corresponde.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalido:
                  summary: Campos inválidos
                  value:
                    status: 400
                    title: Datos inválidos
                    detail: Uno o más campos no son válidos.
                    errors:
                      numero:
                      - Número y fecha de emisión deben enviarse juntos.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          description: El producto no existe, está dado de baja o es de otra empresa; o no tiene registro sanitario (ninguna regla aplicó) o fue dado de baja.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                noEncontrado:
                  summary: No encontrado
                  value:
                    status: 404
                    title: No encontrado
                    detail: El producto no existe o no tiene registro sanitario.
        '409':
          description: El número de registro ya existe dentro de la empresa.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                numeroDuplicado:
                  summary: Número de registro repetido
                  value:
                    status: 409
                    title: Conflicto
                    detail: El número de registro ya existe en tu empresa.
                    errors:
                      numero:
                      - El número de registro ya existe en tu empresa.
    delete:
      tags: [Registros sanitarios]
      operationId: darDeBajaRegistro
      summary: Dar de baja solo el registro del producto (H5)
      description: |
        Baja lógica con confirmación. El producto no se da de baja. El registro
