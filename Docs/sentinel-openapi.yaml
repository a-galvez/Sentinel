      operationId: actualizarRequisitoChecklist
      summary: Marcar cumplido, devolver a pendiente, asignar responsable o fecha límite (H11)
      description: |
        - Al pasar a `Cumplido` se guarda `fechaCumplimiento` y el responsable pasa a ser
          quien lo completó.
        - Al volver a `Pendiente` se borra `fechaCumplimiento`.
        - En el MVP el único responsable posible es el usuario de la empresa.
        - Debe enviarse al menos un campo; solo se modifican los enviados.
        - 400 si `responsableUsuarioId` no es un usuario de la empresa.
        - 404 si el checklist es de un registro o licencia dados de baja.
        - 409 si el registro o la licencia ya no está `EnTramite` (el checklist queda de solo lectura).
      requestBody:
        required: true
