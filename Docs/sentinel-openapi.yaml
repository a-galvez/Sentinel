          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                noEncontrado:
                  summary: No encontrado
                  value:
                    status: 404
                    title: No encontrado
                    detail: El producto no existe o no tiene registro sanitario.

  /productos/{productoId}/registro/verificacion:
    parameters:
      - $ref: '#/components/parameters/ProductoId'
    post:
      tags: [Registros sanitarios]
      operationId: verificarRegistro
      summary: Indicar si el producto ya tiene registro (H3, H11)
      description: |
        Solo válido mientras el registro esté `NoVerificado` (si no, 409). Si `numero` ya existe
        en la empresa, 409 con el error en `numero`. Si `tieneDocumento` es `true` y falta `numero`
        o `fechaEmision`, o es `false` y se envían, 400.

        Orden de validación: 404, luego 409 (estado), luego 400 (cuerpo) y por último 409
        (número duplicado). Si llegan dos solicitudes a la vez, solo una crea el checklist
        (hay un único checklist por registro) y la otra recibe 409.
        - `tieneDocumento: true` → requiere `numero` y `fechaEmision`; se calcula
          vencimiento y estado. **No** se crea checklist.
        - `tieneDocumento: false` → pasa a `EnTramite` y se crea el checklist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificacionRequest'
            examples:
              yaLoTiene:
                summary: Ya tiene el registro
                value:
                  tieneDocumento: true
                  numero: RS-0001-EJ
                  fechaEmision: '2026-10-15'
              noLoTiene:
                summary: Aún no lo tiene (pasa a En trámite)
                value:
                  tieneDocumento: false
      responses:
        '200':
          description: Registro verificado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroSanitario'
              examples:
                yaLoTiene:
                  summary: 'Ya tenía el registro: estado calculado, sin checklist'
                  value:
                    registroId: 00000000-0000-4000-8000-000000000401
                    productoId: 00000000-0000-4000-8000-000000000201
                    tipoDocumento:
                      tipoDocumentoId: 00000000-0000-4000-8000-000000000301
                      codigo: REG-MED
                      nombre: Registro de medicamento
                      autoridadEmisora: ARSA
                      vigenciaMeses: 60
                    estado: Vigente
                    numero: RS-0001-EJ
                    fechaEmision: '2026-10-15'
                    fechaVencimiento: '2031-10-15'
                    diasParaVencer: 1787
                    requiereVerificacion: false
                    tieneChecklist: false
                enTramite:
                  summary: 'No lo tenía: pasa a En trámite con checklist'
                  value:
                    registroId: 00000000-0000-4000-8000-000000000401
                    productoId: 00000000-0000-4000-8000-000000000201
                    tipoDocumento:
                      tipoDocumentoId: 00000000-0000-4000-8000-000000000301
                      codigo: REG-MED
                      nombre: Registro de medicamento
                      autoridadEmisora: ARSA
                      vigenciaMeses: 60
                    estado: EnTramite
                    numero: null
                    fechaEmision: null
                    fechaVencimiento: null
                    diasParaVencer: null
                    requiereVerificacion: false
                    tieneChecklist: true
        '400':
          description: Datos inválidos. `errors` indica el mensaje junto al campo que corresponde.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalido:
                  summary: Campos inválidos
                  value:
                    status: 400
                    title: Datos inválidos
                    detail: Los datos de verificación no son válidos.
                    errors:
                      numero:
                      - El número de registro es obligatorio cuando ya se tiene el documento.
                      fechaEmision:
                      - La fecha de emisión es obligatoria cuando ya se tiene el documento.
                noLoTieneConDatos:
                  summary: Sin documento pero con datos
                  value:
                    status: 400
                    title: Datos inválidos
                    detail: Los datos de verificación no son válidos.
                    errors:
                      tieneDocumento:
                      - No se deben enviar número ni fecha de emisión cuando aún no se tiene el documento.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          description: El producto no existe, está dado de baja o es de otra empresa; o no tiene registro sanitario (ninguna regla aplicó) o fue dado de baja.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                noEncontrado:
                  summary: No encontrado
                  value:
                    status: 404
                    title: No encontrado
                    detail: El producto no existe o no tiene registro sanitario.
        '409':
          description: El registro ya no está `NoVerificado` o el número ya existe en la empresa.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                yaVerificado:
                  summary: Registro ya verificado
                  value:
                    status: 409
                    title: Conflicto
                    detail: El registro ya fue verificado. Solo se puede verificar mientras está en estado No verificado.
                numeroDuplicado:
                  summary: Número de registro repetido
                  value:
                    status: 409
                    title: Conflicto
                    detail: El número de registro ya existe en tu empresa.
                    errors:
                      numero:
                      - El número de registro ya existe en tu empresa.

